name: Deploy to DC01

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, DC01]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy script to DC01
        shell: powershell
        run: |
          # Копируем скрипты в целевую папку
          Copy-Item -Path .\*.ps1 -Destination C:\AD_Scripts\ -Force -Verbose
          Write-Host "Deployment completed at $(Get-Date)" -ForegroundColor Green
